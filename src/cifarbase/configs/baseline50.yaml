# One of the four GRDH arms. All four share baseline.yaml's recipe verbatim --
# lr 0.1, nesterov, weight decay 5e-4, cosine with a 5-epoch warmup -- at a
# 50-epoch budget, from the same seed and therefore the same theta_0. Only the
# a_* and anchor_* keys differ between them; anything else moving would make
# the comparison a comparison of recipes.
#
# RUN 1 -- the control. Plain ReLU throughout (alpha = 0), no anchor.
# The number every other arm is measured against.

seeds: "0"

batch_size: 128
val_size: 0
augment: true

arch: resnet18
width: 64
zero_init_residual: true

epochs: 50
optimizer: sgd
lr: 0.1
momentum: 0.9
nesterov: true
weight_decay: 5.0e-4
schedule: cosine
warmup_epochs: 5

ckpt_every: 5
diag_every: 5
per_class: true

