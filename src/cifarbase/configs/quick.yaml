# A plumbing check, not an experiment: does the whole path from config to
# results.json run without falling over? Two epochs of a narrow net on 4k images
# finishes on a CPU in a couple of minutes and proves nothing about accuracy.
#
# Pair it with CIFAR_ALLOW_CPU=1 (see `make quick`), because pick_device refuses
# to fall back to CPU inside a Kaggle session.

seeds: "0"
quick: false          # this file IS the small config; no need for _QUICK on top

batch_size: 128
eval_batch_size: 500
train_subset: 4000
val_size: 1000
augment: true

arch: resnet18
width: 16

epochs: 2
lr: 0.05
# Per-arm, as in compare.yaml: only the unanchored arm carries decay, because
# config.py refuses decay and an anchor in the same arm.
weight_decay: 0.0
warmup_epochs: 0
schedule: cosine

per_class: false

# The probe and the hold window are STEP counts, and 4000 images at batch 128 is
# 31 steps an epoch -- 62 in the whole run. Left at their real values the probe
# would fire once and the controller would never leave its hold, so a quick run
# would exercise none of the code it exists to check.
probe_every: 5
probe_batch: 40
probe_tangents: 4
anchor_hold_steps: 5
hessian_every: 20
hessian_iters: 4
ckpt_every: 1
probe_group_every: 2
anchor_alloc_every: 2

# Three arms, so the smoke test actually walks the code it exists to check: the
# unanchored path, the open-loop pull, and the closed loop with the allocation
# on. beta and dmax here are ARBITRARY -- 1.0 because it is a number, not because
# anything fitted it. That is admissible only here: this config asserts that the
# plumbing runs, never that a controller is calibrated. Every real anchored
# config refuses to start until the pilot has produced both.
arms:
  - {name: baseline_wd, weight_decay: 5.0e-4}
  - {name: const, anchor_mode: const, anchor_lambda: 0.01}
  - {name: alloc, anchor_mode: adaptive, anchor_beta: 1.0, anchor_dmax: 1.0,
     anchor_alloc: adaptive}
